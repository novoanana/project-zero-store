<title>PROJECT ZERO | Modelo B - Demo visual</title>
<style>
/* ==========================================================
   PROJECT ZERO V0.7 — DEMO VISUAL MODELO B
   Archivo: index.html | CSS autocontenido | Sin dependencias
   ========================================================== */
:root {
 --ink:#11121a; --white:#fff; --blue:#43c8f2; --pink:#f45de2;
 --yellow:#ffe500; --purple:#9a45ff; --soft:#f4f0ff; --line:#e7e1f1;
 --radius:22px; --shadow:0 18px 50px rgba(29,24,56,.13);
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { min-height:100vh; font-family:Inter,Arial,Helvetica,sans-serif; color:var(--ink); background:linear-gradient(135deg,#e8f8ff 0%,#f9eaff 48%,#fff7d7 100%); }
button,a { font:inherit; }
a { color:inherit; text-decoration:none; }
/* Marco general */
.page { width:min(1440px, calc(100% - 28px)); margin:20px auto; }
.demo-label { display:inline-flex; align-items:center; gap:10px; margin:0 0 12px 10px; padding:9px 15px; border-radius:12px; color:#fff; background:#171820; font-size:clamp(13px,1.5vw,18px); font-weight:800; box-shadow:0 4px 14px #0002; }
.store { overflow:hidden; border:2px solid #e2d8ef; border-radius:24px; background:#fff; box-shadow:var(--shadow); }
/* HEADER_PRINCIPAL */
.header { min-height:82px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px clamp(16px,4vw,46px); background:rgba(255,255,255,.94); border-bottom:1px solid #eee8f6; }
.brand { display:flex; align-items:center; gap:9px; min-width:175px; font-weight:950; line-height:.9; letter-spacing:-1px; }
.brand-mark { font-size:42px; font-weight:1000; transform:skew(-12deg); letter-spacing:-5px; }
.brand-name { font-size:18px; letter-spacing:-.7px; }
.nav { display:flex; align-items:center; justify-content:center; gap:clamp(14px,3.1vw,42px); flex:1; }
.nav a { font-size:14px; font-weight:700; padding:12px 0; position:relative; white-space:nowrap; }
.nav a.active:after { content:""; position:absolute; left:0; right:0; bottom:3px; height:2px; background:var(--ink); border-radius:2px; }
.actions { display:flex; align-items:center; gap:clamp(12px,2vw,24px); }
.icon-btn { position:relative; border:0; background:transparent; color:var(--ink); cursor:pointer; width:28px; height:32px; display:grid; place-items:center; }
.icon-btn svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.cart-count { position:absolute; top:-4px; right:-7px; background:#111; color:white; border-radius:50%; width:17px; height:17px; font-size:10px; display:grid; place-items:center; font-weight:800; }
.menu-toggle { display:none; }
/* BANNER_INICIO_MODELO_B: la referencia visual original queda incorporada */
.hero-reference { width:100%; display:block; height:auto; }
/* Nota informativa de prototipo */
.demo-note { padding:14px 20px; text-align:center; background:#fff; border-top:1px solid #eee; color:#8b8497; font-size:11px; letter-spacing:1.5px; font-weight:700; }
/* Toast demo */
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; z-index:99; padding:13px 20px; border-radius:999px; background:#171820; color:#fff; font-size:14px; font-weight:700; box-shadow:0 12px 30px #0003; transition:.25s ease; max-width:calc(100vw - 30px); text-align:center; }
.toast.show { opacity:1; transform:translate(-50%,0); }
/* Responsive */
@media(max-width:850px) {
 .header { min-height:70px; padding:12px 18px; } .brand { min-width:0; } .brand-mark { font-size:35px; } .brand-name { font-size:15px; }
 .nav { display:none; position:absolute; z-index:20; top:82px; left:14px; right:14px; flex-direction:column; gap:0; align-items:stretch; padding:10px 18px; border-radius:16px; background:#fff; box-shadow:var(--shadow); }
 .nav.open { display:flex; } .nav a { padding:13px 4px; border-bottom:1px solid #f0edf5; } .nav a:last-child { border-bottom:0; }
 .menu-toggle { display:grid; } .actions { gap:13px; } .page { width:calc(100% - 16px); margin:8px auto; } .demo-label { margin-left:4px; }
}
@media(max-width:480px) { .brand-mark { font-size:30px; } .brand-name { font-size:13px; } .header { gap:10px; } .actions .optional { display:none; } .demo-note { font-size:9px; padding:11px 8px; } }
</style>
</head>

<div class="toast" id="DEMO_TOAST" role="status" aria-live="polite"></div>
<script>
/* ==========================================================
   JS_DEMO_INTERACCIONES — solo interacciones de demostración
   ========================================================== */
(function() {
  const toast = document.getElementById('DEMO_TOAST');
  let toastTimer;
  function showDemoMessage(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }
  document.querySelectorAll('[data-demo]').forEach(element => {
    element.addEventListener('click', event => {
      event.preventDefault();
      showDemoMessage(element.getAttribute('data-demo'));
    });
  });
  const menuButton = document.getElementById('MENU_TOGGLE');
  const nav = document.getElementById('NAV_PRINCIPAL');
  menuButton.addEventListener('click', () => {
    const opened = nav.classList.toggle('open');
    menuButton.setAttribute('aria-expanded', String(opened));
  });
  nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => nav.classList.remove('open')));
})();
</script>
